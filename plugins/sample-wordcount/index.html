<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Word count</title>
  <style>
    body { margin: 12px; font: 13px/1.4 sans-serif; color: var(--deskmark-fg, CanvasText); background: transparent; }
    strong { font-size: 28px; }
  </style>
</head>
<body>
  <div id="count">0</div>
  <script>
    const count = document.querySelector("#count")
    const show = async () => {
      const bridge = window.deskmark
      if (!bridge) throw new Error("missing")
      const note = await bridge.call("notes.read", {})
      const text = String(note && note.result && note.result.markdown || "")
      if (!note.ok) throw new Error(note.error || "failed")
      const words = text.trim() ? text.trim().split(/\s+/).length : 0
      count.textContent = String(words)
    }
    if (window.deskmark && window.deskmark.onNote) window.deskmark.onNote(() => { show().catch(() => { count.textContent = "-" }) })
    show().catch(() => { count.textContent = "-" })
  </script>
</body>
</html>
